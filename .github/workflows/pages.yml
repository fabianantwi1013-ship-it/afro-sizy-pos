name: Deploy demo to GitHub Pages

# Publishes the browser-only demo build (dist/) to GitHub Pages on every push
# to main. The real till is unaffected — it runs from public/ on the salon's
# own machine and never touches this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the demo
        run: npm run build:demo

      - name: Check the build looks right
        run: |
          test -f dist/index.html
          test -f dist/js/demo/catalogue.js
          test -f dist/js/demo/message.js
          grep -q 'data-pos-mode="demo"' dist/index.html
          grep -q 'href="css/styles.css"' dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
