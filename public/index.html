<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B8283F">
<title>Afro &amp; Sizy — Point of Sale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B8283F'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='16' font-weight='bold' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div id="lock" class="lock" hidden>
  <form class="lock__card" id="lock-form">
    <div class="lock__mark">A&amp;S</div>
    <h1>Salon locked</h1>
    <p>Enter the PIN to take payments.</p>
    <input id="lock-pin" class="lock__pin" type="password" inputmode="numeric" autocomplete="off"
           maxlength="8" placeholder="••••" aria-label="PIN">
    <p class="lock__error" id="lock-error" role="alert"></p>
    <button class="btn btn--brand btn--block" type="submit">Unlock</button>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <aside class="nav">
    <div class="nav__brand">
      <span class="nav__mark">A&amp;S</span>
      <span class="nav__names">
        <strong id="brand-name">Afro &amp; Sizy</strong>
        <small id="brand-sub">Point of Sale</small>
      </span>
    </div>
    <nav class="nav__links" id="nav-links"></nav>
    <div class="nav__foot">
      <span id="clock" class="nav__clock"></span>
      <span id="today-total" class="nav__today"></span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="topbar__menu" id="menu-toggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <h1 class="topbar__title" id="view-title">New Sale</h1>
      <div class="topbar__actions" id="view-actions"></div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog class="modal" id="modal"></dialog>
<div id="receipt-slot" class="receipt-slot" aria-hidden="true"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
